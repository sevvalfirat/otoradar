# PostgreSQL: tek kopya, verisi node1'in diskinde (local-path) durur.
# Bilinçli tercih: veritabanı node1'e sabitlenir. node1 çökerse veritabanı da
# gider; README'de "bilinen sınırlama" olarak belirtilmiştir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: otoradar
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otoradar
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # aynı diski iki pod aynı anda kullanmasın
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: otoradar
            - name: POSTGRES_USER
              value: otoradar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otoradar-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "otoradar", "-d", "otoradar"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "otoradar", "-d", "otoradar"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otoradar
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
