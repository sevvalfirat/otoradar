# 1) Alan adı için Ingress: HTTPS + Let's Encrypt sertifikası + HTTP'den HTTPS'e yönlendirme
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otoradar
  namespace: otoradar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: otoradar-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - otoradar.net.tr
        - www.otoradar.net.tr
      secretName: otoradar-tls
  rules:
    - host: otoradar.net.tr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otoradar-web
                port:
                  number: 80
    - host: www.otoradar.net.tr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otoradar-web
                port:
                  number: 80
---
# 2) IP ile erişim (http://82.153.241.242): yönlendirme yok.
#    Failover demosundaki curl testleri bu yolu kullanır.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otoradar-ip
  namespace: otoradar
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otoradar-web
                port:
                  number: 80
---
# 3) Traefik ara katmanı: http:// ile gelen istekleri https:// adresine kalıcı yönlendirir
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: otoradar
spec:
  redirectScheme:
    scheme: https
    permanent: true