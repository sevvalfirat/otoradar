# Dışarıdan gelen HTTP (80) isteklerini K3s'in Traefik'i üzerinden web servisine yönlendirir.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otoradar
  namespace: otoradar
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otoradar-web
                port:
                  number: 80
